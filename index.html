<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5E6E6">
  <title>DAYMARSHOP | Sistema empresarial</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <style>
    :root {
      color-scheme: light;
      --rosa-vieja: #D4A5A5;
      --rosa-vieja-claro: #EDD5D5;
      --rosa-suave: #F5E6E6;
      --negro: #1a1a1a;
      --blanco: #fff;
      --gris: #777;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(212,165,165,.25), transparent 23%),
        radial-gradient(circle at 88% 84%, rgba(212,165,165,.20), transparent 25%),
        var(--rosa-suave);
      color: var(--negro);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .login-shell {
      position: relative;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      width: min(100%, 1000px);
      min-height: 570px;
      overflow: hidden;
      border: 1px solid rgba(26,26,26,.06);
      border-radius: 28px;
      background: var(--blanco);
      box-shadow: 0 28px 80px rgba(67,40,40,.16);
    }

    .visual-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 42px 46px 34px;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(145deg, var(--rosa-vieja-claro) 0%, var(--rosa-vieja) 100%);
    }

    .visual-panel::before, .visual-panel::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 50%;
      pointer-events: none;
    }
    .visual-panel::before {
      width: 470px;
      height: 470px;
      top: 100px;
      right: -275px;
      box-shadow: 0 0 0 30px rgba(255,255,255,.07), 0 0 0 68px rgba(255,255,255,.055);
    }
    .visual-panel::after {
      width: 240px;
      height: 240px;
      left: -145px;
      bottom: -155px;
      background: rgba(255,255,255,.07);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 15px;
      background: var(--negro);
      color: #fff;
      font-family: Georgia, serif;
      font-size: 23px;
      font-weight: 700;
      box-shadow: 0 8px 17px rgba(26,26,26,.15);
    }
    .brand-name {
      margin: 0;
      color: var(--negro);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .14em;
    }
    .brand-tagline {
      display: block;
      margin-top: 5px;
      color: rgba(26,26,26,.62);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .22em;
    }

    .visual-heading {
      position: relative;
      z-index: 1;
      margin: 54px 0 18px;
    }
    .visual-kicker {
      margin: 0 0 12px;
      color: rgba(26,26,26,.62);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    .visual-heading h2 {
      max-width: 380px;
      margin: 0;
      font-size: clamp(29px, 3.8vw, 43px);
      font-weight: 650;
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    /* Ilustración abstracta de información y registros empresariales */
    .visual-stage {
      position: relative;
      display: grid;
      flex: 1;
      min-height: 245px;
      place-items: center;
    }
    .orbit {
      position: absolute;
      width: 310px;
      height: 205px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 50%;
      transform: rotate(-18deg);
    }
    .orbit::after {
      content: "";
      position: absolute;
      top: 23px;
      right: 30px;
      width: 10px;
      height: 10px;
      border: 3px solid var(--rosa-vieja-claro);
      border-radius: 50%;
      background: var(--negro);
    }
    .data-window {
      position: relative;
      z-index: 1;
      width: min(100%, 340px);
      padding: 14px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 18px;
      background: rgba(255,255,255,.83);
      box-shadow: 0 22px 42px rgba(81,48,48,.20);
      transform: rotate(-3deg);
      backdrop-filter: blur(9px);
    }
    .window-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 14px;
      margin-bottom: 13px;
      padding: 0 2px 10px;
      border-bottom: 1px solid #f0e6e6;
    }
    .window-bar i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--rosa-vieja);
      opacity: .72;
    }
    .window-bar span {
      width: 62px;
      height: 4px;
      margin-left: 7px;
      border-radius: 4px;
      background: #e9dddd;
    }
    .window-content { display: grid; grid-template-columns: 37px 1fr; gap: 11px; }
    .window-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-radius: 10px;
      background: #f8eeee;
    }
    .window-rail i {
      width: 13px;
      height: 13px;
      border-radius: 4px;
      background: var(--rosa-vieja-claro);
    }
    .window-rail i:first-child { background: var(--rosa-vieja); }
    .window-main { display: grid; gap: 9px; }
    .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .metric {
      height: 38px;
      padding: 7px;
      border: 1px solid #f0e4e4;
      border-radius: 7px;
      background: #fff;
    }
    .metric::before, .metric::after {
      content: "";
      display: block;
      height: 4px;
      border-radius: 4px;
      background: #eadede;
    }
    .metric::before { width: 56%; margin-bottom: 6px; }
    .metric::after { width: 80%; height: 7px; background: var(--rosa-vieja-claro); }
    .chart {
      display: flex;
      align-items: end;
      justify-content: space-around;
      gap: 7px;
      height: 76px;
      padding: 11px 13px 0;
      border: 1px solid #f0e4e4;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff, #fcf7f7);
    }
    .chart i {
      width: 13%;
      border-radius: 4px 4px 0 0;
      background: var(--rosa-vieja-claro);
    }
    .chart i:nth-child(1) { height: 35%; }
    .chart i:nth-child(2) { height: 56%; }
    .chart i:nth-child(3) { height: 43%; }
    .chart i:nth-child(4) { height: 78%; background: var(--rosa-vieja); }
    .chart i:nth-child(5) { height: 65%; }
    .chart i:nth-child(6) { height: 92%; background: var(--rosa-vieja); }
    .window-lines { display: grid; gap: 5px; padding: 0 3px; }
    .window-lines i {
      display: block;
      width: 100%;
      height: 4px;
      border-radius: 4px;
      background: #eee5e5;
    }
    .window-lines i:nth-child(2) { width: 78%; }
    .window-lines i:nth-child(3) { width: 89%; }

    .visual-caption {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(26,26,26,.67);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .04em;
    }
    .caption-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--negro);
      box-shadow: 0 0 0 4px rgba(26,26,26,.08);
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 58px clamp(34px, 5vw, 68px);
      background: var(--blanco);
    }
    .form-kicker {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 16px;
      color: #966e6e;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    .form-kicker::before {
      content: "";
      width: 21px;
      height: 2px;
      border-radius: 2px;
      background: var(--rosa-vieja);
    }
    .form-panel h1 {
      margin: 0;
      color: var(--negro);
      font-size: 32px;
      font-weight: 650;
      letter-spacing: -.045em;
    }
    .form-subtitle {
      margin: 9px 0 34px;
      color: var(--gris);
      font-size: 13px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      color: #383333;
      font-size: 12px;
      font-weight: 650;
    }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 17px;
      height: 17px;
      color: #987b7b;
      transform: translateY(-50%);
      pointer-events: none;
    }
    input {
      width: 100%;
      height: 50px;
      padding: 0 14px 0 42px;
      border: 1px solid #e8dede;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--negro);
      font: inherit;
      font-size: 13px;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #b6aaaa; }
    input:focus {
      border-color: var(--rosa-vieja);
      box-shadow: 0 0 0 4px rgba(212,165,165,.17);
    }
    .submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 51px;
      margin-top: 9px;
      border: 0;
      border-radius: 10px;
      background: var(--negro);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 0 9px 18px rgba(26,26,26,.14);
      transition: background .2s, transform .2s, box-shadow .2s;
    }
    .submit-button:hover {
      background: #343030;
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(26,26,26,.19);
    }
    .submit-button:focus-visible { outline: 3px solid var(--rosa-vieja); outline-offset: 3px; }
    .submit-button svg { width: 17px; height: 17px; }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      background: rgba(245,230,230,.88);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--rosa-vieja-claro);
      border-top-color: var(--rosa-vieja);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      body { padding: 18px; }
      .login-shell { width: min(100%, 490px); grid-template-columns: 1fr; min-height: 0; border-radius: 22px; }
      .visual-panel { min-height: 310px; padding: 27px 29px 20px; }
      .brand-mark { width: 40px; height: 40px; flex-basis: 40px; border-radius: 13px; font-size: 20px; }
      .brand-name { font-size: 15px; }
      .visual-heading { margin: 27px 0 0; }
      .visual-heading h2 { font-size: 27px; }
      .visual-kicker { margin-bottom: 8px; font-size: 9px; }
      .visual-stage { position: absolute; width: 47%; min-height: 0; height: 170px; right: 10px; bottom: 22px; }
      .data-window { width: 210px; max-width: 100%; padding: 9px; border-radius: 12px; }
      .window-content { grid-template-columns: 24px 1fr; gap: 7px; }
      .window-rail { gap: 7px; }
      .window-rail i { width: 9px; height: 9px; }
      .metric-row { gap: 4px; }
      .metric { height: 30px; padding: 5px; }
      .chart { height: 54px; padding: 8px 9px 0; gap: 5px; }
      .window-lines { gap: 4px; }
      .visual-caption { position: absolute; left: 29px; bottom: 22px; font-size: 9px; }
      .form-panel { padding: 34px 30px 36px; }
      .form-subtitle { margin-bottom: 25px; }
    }
    @media (max-width: 390px) {
      body { padding: 10px; }
      .visual-panel { min-height: 285px; padding: 22px 22px 18px; }
      .visual-stage { width: 46%; height: 145px; right: 4px; }
      .data-window { width: 175px; }
      .visual-heading { margin-top: 24px; }
      .visual-heading h2 { max-width: 180px; font-size: 24px; }
      .visual-caption { left: 22px; bottom: 19px; }
      .form-panel { padding: 29px 22px 30px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="visual-panel" aria-label="DAYMARSHOP, sistema empresarial">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">D</div>
        <div>
          <p class="brand-name">DAYMARSHOP</p>
          <span class="brand-tagline">A FAMILY COMPANY</span>
        </div>
      </header>

      <div class="visual-heading">
        <p class="visual-kicker">Sistema empresarial</p>
        <h2>Información bajo control.</h2>
      </div>

      <div class="visual-stage" aria-hidden="true">
        <div class="orbit"></div>
        <div class="data-window">
          <div class="window-bar"><i></i><i></i><i></i><span></span></div>
          <div class="window-content">
            <div class="window-rail"><i></i><i></i><i></i><i></i></div>
            <div class="window-main">
              <div class="metric-row"><div class="metric"></div><div class="metric"></div><div class="metric"></div></div>
              <div class="chart"><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div class="window-lines"><i></i><i></i><i></i></div>
            </div>
          </div>
        </div>
      </div>

      <div class="visual-caption"><span class="caption-dot"></span>Gestión interna</div>
    </section>

    <section class="form-panel" aria-labelledby="loginTitle">
      <p class="form-kicker">Portal empresarial</p>
      <h1 id="loginTitle">Iniciar sesión</h1>
      <p class="form-subtitle">Ingresa tus credenciales para continuar.</p>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="userID">Usuario</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M5 20c.6-3.3 3.1-5 7-5s6.4 1.7 7 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input type="text" id="userID" name="username" placeholder="Ingresa tu usuario" autocomplete="username" required autofocus>
          </div>
        </div>
        <div class="field">
          <label for="userClave">Contraseña</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input type="password" id="userClave" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
          </div>
        </div>
        <button class="submit-button" type="submit">
          Entrar
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>
  </main>

  <div id="loadingOverlay" role="status" aria-label="Ingresando">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    /* ---------- IndexedDB ---------- */
    const DB_NAME = 'sessionDB', STORE_NAME = 'sessions';
    let db;

    async function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(db = request.result);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    }

    async function guardarSesion(user) {
      const transaction = db.transaction([STORE_NAME], 'readwrite');
      transaction.objectStore(STORE_NAME).put(user);
    }

    /* ---------- Usuarios ---------- */
    const users = [
      { id: '2005', clave: 'admin2024', nombre: 'ERNESTO TOBIAS', foto: 'user2005.jpg' },
      { id: '1001', clave: 'viewer2024', nombre: 'PAOLA PALACIOS', foto: 'userpaola.jpg' }
    ];

    /* ---------- Login ---------- */
    async function login() {
      const userID = document.getElementById('userID').value.trim();
      const userClave = document.getElementById('userClave').value.trim();
      const user = users.find(item => item.id === userID && item.clave === userClave);

      if (!user) {
        alert('ID o contraseña incorrectos.');
        return;
      }

      try {
        if (!db) await openDB();
        await guardarSesion(user);
      } catch (error) {
        console.error('No se pudo guardar la sesión:', error);
        alert('No se pudo iniciar el sistema. Intenta de nuevo.');
        return;
      }

      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('userID', user.id);
      sessionStorage.setItem('nombre', user.nombre);
      sessionStorage.setItem('foto', user.foto);

      document.getElementById('loadingOverlay').style.display = 'grid';
      location.href = 'menu.html';
    }

    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      login();
    });

    window.addEventListener('DOMContentLoaded', () => {
      openDB().catch(error => console.error('No se pudo abrir la base de datos de sesión:', error));
    });
  </script>
</body>
</html>
