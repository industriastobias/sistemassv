<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1F2937">
  <meta name="robots" content="noindex,nofollow">
  <title>DAYMARSHOP</title>
  <link rel="icon" type="image/png" href="./isotipo.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --ink-2: #4B5563;
      --muted: #9CA3AF;
      --line: #E5E7EB;
      --accent: #AEB4BC;
      --dark-1: #1F2937;
      --dark-2: #111827;
      --error: #B91C1C;
      --error-bg: #FEF2F2;
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(800px 420px at 85% 0%, rgba(174,180,188,.25), transparent 70%),
        radial-gradient(700px 380px at 0% 100%, rgba(174,180,188,.18), transparent 70%),
        #F3F4F6;
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(100%, 860px);
      min-height: 460px;
      border-radius: 20px;
      background: #FFFFFF;
      box-shadow: 0 30px 60px -20px rgba(17,24,39,.25), 0 2px 6px rgba(17,24,39,.05);
      overflow: hidden;
      animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
    }

    /* Panel de marca */
    .brand-side {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px;
      color: #FFFFFF;
      background: linear-gradient(155deg, var(--dark-1) 0%, var(--dark-2) 100%);
      overflow: hidden;
    }
    .brand-side::before,
    .brand-side::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(174,180,188,.18);
      pointer-events: none;
    }
    .brand-side::before { width: 380px; height: 380px; top: -160px; right: -170px; }
    .brand-side::after  { width: 260px; height: 260px; bottom: -120px; left: -110px; }

    .logo-tile {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 120px;
      height: 120px;
      border-radius: 28px;
      background: #FFFFFF;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .brand-logo { width: 84px; height: 76px; object-fit: contain; }

    .brand-name {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .22em;
    }
    .brand-line {
      position: relative;
      z-index: 1;
      width: 36px;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    /* Formulario */
    .form-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 52px;
    }
    h1 {
      margin: 0 0 30px;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -.03em;
    }

    .error {
      display: none;
      margin-bottom: 18px;
      padding: 11px 14px;
      border-radius: 10px;
      background: var(--error-bg);
      color: var(--error);
      font-size: 12px;
      font-weight: 500;
    }
    .error.show { display: block; }

    .field {
      position: relative;
      margin-bottom: 16px;
    }
    .field > svg {
      position: absolute;
      top: 50%;
      left: 16px;
      width: 17px;
      height: 17px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
      transition: color .2s;
    }
    .field:focus-within > svg { color: var(--dark-1); }

    input {
      width: 100%;
      height: 50px;
      padding: 0 46px 0 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #F9FAFB;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      background: #FFFFFF;
      border-color: var(--dark-1);
      box-shadow: 0 0 0 4px rgba(31,41,55,.08);
    }

    .toggle-pass {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 34px;
      height: 34px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color .2s, background .2s;
    }
    .toggle-pass:hover { color: var(--ink-2); background: #F3F4F6; }
    .toggle-pass:focus-visible { outline: 2px solid var(--dark-1); outline-offset: 1px; }
    .toggle-pass svg { width: 17px; height: 17px; }

    .submit {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--dark-1), var(--dark-2));
      color: #FFFFFF;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 10px 22px -10px rgba(17,24,39,.6);
      transition: transform .15s, box-shadow .2s, opacity .2s;
    }
    .submit:hover { transform: translateY(-1px); box-shadow: 0 14px 26px -10px rgba(17,24,39,.6); }
    .submit:active { transform: translateY(0); }
    .submit:disabled { opacity: .6; cursor: default; transform: none; }
    .submit:focus-visible { outline: 2px solid var(--dark-1); outline-offset: 3px; }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(243,244,246,.9);
      backdrop-filter: blur(4px);
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--line);
      border-top-color: var(--dark-1);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    @media (max-width: 680px) {
      .card { grid-template-columns: 1fr; width: min(100%, 420px); min-height: 0; }
      .brand-side { padding: 30px 24px; }
      .logo-tile { width: 92px; height: 92px; border-radius: 22px; }
      .brand-logo { width: 64px; height: 58px; }
      .form-side { padding: 32px 26px 36px; }
      h1 { font-size: 23px; margin-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="brand-side" aria-hidden="true">
      <div class="logo-tile">
        <img class="brand-logo" src="./isotipo.png" alt="" width="84" height="76">
      </div>
      <span class="brand-line"></span>
      <p class="brand-name">DAYMARSHOP</p>
    </section>

    <section class="form-side" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Iniciar sesión</h1>

      <div class="error" id="errorMsg" role="alert"></div>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.6-3.3 3.1-5 7-5s6.4 1.7 7 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="userID" name="username" placeholder="Usuario" aria-label="Usuario" autocomplete="username" required autofocus>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="password" id="userClave" name="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </div>

        <button class="submit" type="submit">Ingresar</button>
      </form>
    </section>
  </main>

  <div id="loadingOverlay" role="status" aria-label="Ingresando"><div class="spinner" aria-hidden="true"></div></div>

  <script>
    /* ---------- IndexedDB ---------- */
    const DB_NAME = 'sessionDB', STORE_NAME = 'sessions';
    let dbPromise = null;

    // Se abre una sola vez y se reutiliza.
    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, 1);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              database.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
        });
      }
      return dbPromise;
    }

    // Espera a que la escritura termine antes de navegar.
    async function guardarSesion(user) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readwrite');
        tx.objectStore(STORE_NAME).put(user);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }

    /* ---------- Usuarios ---------- */
    const users = [
      { id: '2005', clave: 'admin2024', nombre: 'ERNESTO TOBIAS', foto: 'user2005.jpg' },
      { id: '1001', clave: 'viewer2024', nombre: 'PAOLA PALACIOS', foto: 'userpaola.jpg' }
    ];

    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.querySelector('.submit');

    function mostrarError(texto) {
      errorMsg.textContent = texto;
      errorMsg.classList.add('show');
    }

    /* ---------- Login ---------- */
    async function login() {
      errorMsg.classList.remove('show');
      const userID = document.getElementById('userID').value.trim();
      const userClave = document.getElementById('userClave').value.trim();

      if (!userID || !userClave) {
        mostrarError('Completa tu usuario y contraseña.');
        return;
      }

      const user = users.find(item => item.id === userID && item.clave === userClave);
      if (!user) {
        mostrarError('ID o contraseña incorrectos.');
        document.getElementById('userClave').select();
        return;
      }

      submitBtn.disabled = true;
      try {
        await guardarSesion(user);
      } catch (error) {
        console.error('No se pudo guardar la sesión:', error);
        mostrarError('No se pudo iniciar el sistema. Intenta de nuevo.');
        submitBtn.disabled = false;
        return;
      }

      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('userID', user.id);
      sessionStorage.setItem('nombre', user.nombre);
      sessionStorage.setItem('foto', user.foto);

      document.getElementById('loadingOverlay').style.display = 'grid';
      location.href = 'menu.html';
    }

    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      login();
    });

    /* ---------- Mostrar / ocultar contraseña ---------- */
    const claveInput = document.getElementById('userClave');
    const toggleBtn = document.getElementById('togglePass');
    toggleBtn.addEventListener('click', () => {
      const mostrar = claveInput.type === 'password';
      claveInput.type = mostrar ? 'text' : 'password';
      toggleBtn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    getDB().catch(error => console.error('No se pudo abrir la base de datos de sesión:', error));
  </script>
</body>
</html>
