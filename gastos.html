
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo – Klohe</title>

  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #222222;
      --line: #e5e5e5;
      --accent: #f9c74f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0 1rem 4rem 1rem;
    }
    .header-fixed {
      position: sticky; top: 0; z-index: 1000;
      background: var(--line); padding: 1rem 0;
      margin-bottom: 2rem; border-bottom: 1px solid var(--line);
      text-align: center; font-weight: 600;
    }
    .catalogo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      max-width: 1200px; margin: 0 auto;
    }
    @media (max-width: 900px) { .catalogo { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .catalogo { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 400px) { .catalogo { grid-template-columns: 1fr; } }

    .producto {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn .5s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    .producto img {
      width: 100%; aspect-ratio: 1/1;
      object-fit: cover; border-radius: 4px;
      cursor: pointer;
    }
    .producto-galeria {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .producto-galeria img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
    }
    .producto-galeria img:only-child {
      grid-column: 1 / -1;
    }
    .producto-info {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: .4rem;
      text-align: left;
    }
    .producto h3, .producto-nombre {
      margin: .8rem 0 .2rem;
      font-size: 1rem;
      line-height: 1.25;
      text-align: center;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .producto-dato {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      min-height: 1.5rem;
      padding: .3rem .45rem;
      border-bottom: 1px solid var(--line);
      font-size: .8rem;
    }
    .producto-dato span { color: #666; }
    .producto-dato strong { color: #222; text-align: right; word-break: break-word; }
    .producto-barcode {
      width: 100%;
      height: 42px;
      display: block;
      margin: .15rem 0 .25rem;
    }
    .producto-precio {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15rem;
      margin-top: .25rem;
      padding: .55rem .4rem;
      background: #fff8df;
      border-radius: 5px;
      text-align: center;
    }
    .producto-precio strong { font-size: 1.05rem; color: #222; }
    .producto-precio small {
      color: #6b5b22;
      font-size: .7rem;
      line-height: 1.25;
      text-transform: lowercase;
    }
    .producto p { margin: .2rem 0; font-size: .8rem; }

    .modal {
      display: none; position: fixed; z-index: 9999;
      left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.88); justify-content: center; align-items: center;
    }
    .modal img { max-width: 95vw; max-height: 95vh; border-radius: 4px; }
    .modal-close { position: absolute; top: 1rem; right: 1.5rem; color: #fff; font-size: 2rem; cursor: pointer; }

    .btn-fixed {
      position: fixed; bottom: 20px; border: none; padding: 12px 18px; border-radius: 30px;
      font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 2000;
    }
    #btnPdf { right: 20px; background: var(--accent); }
    #btnZip { right: 160px; background: #06d6a0; color: #fff; display: none; }
    #btnWix { right: 300px; background: #118ab2; color: #fff; }
  </style>
</head>
<body>

  <header class="header-fixed"><h1>CATÁLOGO KLOHE</h1></header>

  <div class="catalogo" id="catalogo"></div>

  <div id="modal" class="modal">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <img id="modalImg" src="" alt="Imagen ampliada">
  </div>

  <button id="btnPdf" class="btn-fixed" onclick="descargarPDF()">Descargar PDF</button>
  <button id="btnZip" class="btn-fixed" onclick="descargarZIP()">Descargar imágenes</button>
  <button id="btnWix" class="btn-fixed" onclick="descargarWixCSV()">Descargar Wix CSV</button>

  <script>
    /* ---------- CATALOGO / MODAL / PDF / ZIP (igual que antes) ---------- */
    const catalogo = document.getElementById('catalogo');
    const modal    = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');

    const ordenCategorias = [
      'Carteras','Collares','Aritos','Pulseras','Anillos',
      'Accesorios para el cabello','Lentes de sol','Chokers','Relojes',
      'Billeteras','Case teléfonos','Case audífonos','General','Otros'
    ];

    const unidadesLetras = [
      'cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve',
      'diez','once','doce','trece','catorce','quince','dieciséis','diecisiete',
      'dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés',
      'veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'
    ];
    const decenasLetras = ['', '', 'treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
    const centenasLetras = ['', 'ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];

    function numeroEnteroALetras(numero) {
      let n = Math.max(0, Math.floor(Number(numero) || 0));
      if (n < 30) return unidadesLetras[n];
      if (n < 100) {
        const decena = Math.floor(n / 10);
        const unidad = n % 10;
        return unidad ? `${decenasLetras[decena]} y ${unidadesLetras[unidad]}` : decenasLetras[decena];
      }
      if (n < 1000) {
        if (n === 100) return 'cien';
        const centena = Math.floor(n / 100);
        const resto = n % 100;
        return resto ? `${centenasLetras[centena]} ${numeroEnteroALetras(resto)}` : centenasLetras[centena];
      }
      if (n < 1000000) {
        const miles = Math.floor(n / 1000);
        const resto = n % 1000;
        const prefijo = miles === 1 ? 'mil' : `${numeroEnteroALetras(miles)} mil`;
        return resto ? `${prefijo} ${numeroEnteroALetras(resto)}` : prefijo;
      }
      if (n < 1000000000) {
        const millones = Math.floor(n / 1000000);
        const resto = n % 1000000;
        const prefijo = millones === 1 ? 'un millón' : `${numeroEnteroALetras(millones)} millones`;
        return resto ? `${prefijo} ${numeroEnteroALetras(resto)}` : prefijo;
      }
      return String(n);
    }

    function precioEnLetras(valor) {
      const totalCentavos = Math.max(0, Math.round((Number(valor) || 0) * 100));
      const enteros = Math.floor(totalCentavos / 100);
      const centavos = totalCentavos % 100;
      const moneda = enteros === 1 ? 'dólar' : 'dólares';
      return `${numeroEnteroALetras(enteros)} ${moneda} con ${String(centavos).padStart(2, '0')} centavos`;
    }

    function escaparHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function obtenerSrcImagen(blob) {
      if (!blob) return '';
      if (typeof blob === 'string') return blob;
      try { return URL.createObjectURL(blob); } catch (e) { return ''; }
    }

    async function obtenerImagenesProducto(code) {
      const imagenes = [];
      try {
        const cantidad = Number(await localforage.getItem(`img_count_${code}`)) || 0;

        // Formato de múltiples imágenes utilizado por el inventario.
        if (cantidad > 0) {
          for (let i = 0; i < cantidad; i++) {
            const imagen = await localforage.getItem(`img_${code}_${i}`);
            if (imagen) imagenes.push(imagen);
          }
        }

        // Compatibilidad con el formato antiguo de una sola imagen.
        if (!imagenes.length) {
          const imagenAnterior = await localforage.getItem(`img_${code}`);
          if (imagenAnterior) imagenes.push(imagenAnterior);
        }
      } catch (error) {
        console.warn('No se pudieron cargar las imágenes del producto', code, error);
      }
      return imagenes;
    }

    function categoriasConProductos(porCat) {
      const restantes = Object.keys(porCat).filter(cat => !ordenCategorias.includes(cat));
      return [...ordenCategorias, ...restantes];
    }

    async function renderCatalogo() {
      let lista = [];
      try {
        const almacenado = localStorage.getItem('inventory');
        lista = almacenado ? JSON.parse(almacenado) : [];
        if (!Array.isArray(lista)) lista = [];
      } catch (error) {
        console.error('No se pudo leer el inventario', error);
        lista = [];
      }

      catalogo.innerHTML = '';
      const porCat = {};
      for (const p of lista) {
        const c = p.category || 'Otros';
        if (!porCat[c]) porCat[c] = [];
        porCat[c].push(p);
      }

      let delay = 0;
      let barcodeCounter = 0;
      for (const cat of categoriasConProductos(porCat)) {
        const productos = porCat[cat] || [];
        for (const prod of productos) {
          const div = document.createElement('div');
          div.className = 'producto';
          div.style.animationDelay = `${delay}s`;

          const imagenes = await obtenerImagenesProducto(prod.code);
          const srcs = imagenes.map(obtenerSrcImagen).filter(Boolean);
          const nombre = escaparHtml(prod.name || 'Producto');
          const codigo = escaparHtml(prod.barcode || '');
          const stock = Number(prod.stockUnits ?? prod.quantity ?? prod.stock ?? 0);
          const precio = (prod.discount && prod.discount > 0)
            ? (Number(prod.price || 0) * (1 - Number(prod.discount) / 100)).toFixed(2)
            : Number(prod.price || 0).toFixed(2);
          const precioLetras = escaparHtml(precioEnLetras(precio));
          const barcodeId = `producto-barcode-${barcodeCounter++}`;

          const galeria = srcs.length
            ? `<div class="producto-galeria">${srcs.map((src, index) => `<img src="${src}" alt="${nombre} - imagen ${index + 1}" onclick="openModal(${JSON.stringify(src)})">`).join('')}</div>`
            : '<div style="width:100%;aspect-ratio:1/1;background:#f0f0f0;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#777;font-size:.8rem;">Sin imagen</div>';

          div.innerHTML = `
            ${galeria}
            <div class="producto-info">
              <h3 class="producto-nombre">${nombre}</h3>
              <div class="producto-dato"><span>Código de barras</span><strong>${codigo || 'N/A'}</strong></div>
              ${codigo ? `<svg id="${barcodeId}" class="producto-barcode" aria-label="Código de barras ${codigo}"></svg>` : ''}
              <div class="producto-dato"><span>Stock</span><strong>${stock}</strong></div>
              <div class="producto-precio">
                <span>Precio</span>
                <strong>$${precio}</strong>
                <small>${precioLetras}</small>
              </div>
            </div>
          `;
          catalogo.appendChild(div);

          if (codigo && typeof JsBarcode === 'function') {
            try {
              JsBarcode(`#${barcodeId}`, codigo, { format: 'CODE128', width: 1.35, height: 34, displayValue: false, margin: 0 });
            } catch (error) {
              console.warn('No se pudo generar el código de barras', codigo, error);
            }
          }
          delay += 0.05;
        }
      }

      const hayImagenes = (await Promise.all(lista.map(p => obtenerImagenesProducto(p.code))))
        .some(imagenes => imagenes.length > 0);
      document.getElementById('btnZip').style.display = hayImagenes ? 'block' : 'none';
    }

    function openModal(src) { modalImg.src = src; modal.style.display = 'flex'; }
    function closeModal()  { modal.style.display = 'none'; modalImg.src = ''; }
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    async function descargarPDF() {
      let lista = [];
      try {
        const almacenado = localStorage.getItem('inventory');
        lista = almacenado ? JSON.parse(almacenado) : [];
        if (!Array.isArray(lista)) lista = [];
      } catch (error) {
        alert('No se pudo leer el inventario');
        return;
      }
      if (!lista.length) { alert('No hay productos'); return; }

      const { jsPDF } = window.jspdf || {};
      if (!jsPDF) { alert('No se pudo cargar el generador PDF'); return; }

      const doc = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
      const marg = 40;
      const anchoPag = doc.internal.pageSize.getWidth();
      const altoPag = doc.internal.pageSize.getHeight();
      const gap = 18;
      const tarjAncho = (anchoPag - 2 * marg - 3 * gap) / 4;
      const tarjAlto = tarjAncho + 70;
      let x = marg, y = 60;

      const porCat = {};
      for (const p of lista) {
        const c = p.category || 'Otros';
        if (!porCat[c]) porCat[c] = [];
        porCat[c].push(p);
      }

      for (const cat of categoriasConProductos(porCat)) {
        const prods = porCat[cat] || [];
        for (const p of prods) {
          if (x + tarjAncho > anchoPag - marg) { x = marg; y += tarjAlto + gap; }
          if (y + tarjAlto > altoPag - marg) { doc.addPage(); y = 60; x = marg; }

          const imagenes = await obtenerImagenesProducto(p.code);
          const precio = (p.discount && p.discount > 0)
            ? (Number(p.price || 0) * (1 - Number(p.discount) / 100)).toFixed(2)
            : Number(p.price || 0).toFixed(2);

          doc.setDrawColor(229, 229, 229);
          doc.setFillColor(255, 255, 255);
          doc.setLineWidth(1);
          doc.roundedRect(x, y, tarjAncho, tarjAlto, 4, 4, 'FD');

          if (imagenes.length) {
            try {
              const imgData = await blobToBase64(imagenes[0]);
              if (imgData) {
                const formato = /^data:image\/png/i.test(imgData) ? 'PNG' : 'JPEG';
                doc.addImage(imgData, formato, x + 8, y + 8, tarjAncho - 16, tarjAncho - 16);
              }
            } catch (error) {
              console.warn('No se pudo insertar la imagen en el PDF', p.code, error);
            }
          }

          doc.setFontSize(9);
          doc.setTextColor(34, 34, 34);
          const nombre = String(p.name || 'Producto');
          const ty = y + tarjAncho + 20;
          doc.text(nombre.substring(0, 26) + (nombre.length > 26 ? '…' : ''), x + 8, ty);
          doc.setFontSize(8);
          doc.setFont(undefined, 'normal');
          doc.text(`Cód: ${p.barcode || ''}`, x + 8, ty + 14);
          doc.text(`Stock: ${Number(p.stockUnits ?? p.quantity ?? p.stock ?? 0)}`, x + 8, ty + 26);
          doc.setFontSize(10);
          doc.setFont(undefined, 'bold');
          doc.text(`$${precio}`, x + 8, ty + 38);
          doc.setFontSize(6.5);
          doc.setFont(undefined, 'normal');
          doc.text(precioEnLetras(precio).substring(0, 42), x + 8, ty + 50);
          x += tarjAncho + gap;
        }
      }

      doc.save('catalogo_klohe.pdf');
    }

    function blobToBase64(blob) {
      if (typeof blob === 'string') return Promise.resolve(blob);
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onloadend = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
    }

    async function descargarZIP() {
      let lista = [];
      try {
        const almacenado = localStorage.getItem('inventory');
        lista = almacenado ? JSON.parse(almacenado) : [];
        if (!Array.isArray(lista)) lista = [];
      } catch (error) {
        alert('No se pudo leer el inventario');
        return;
      }
      if (!lista.length) { alert('No hay productos'); return; }

      const zip = new JSZip();
      let totalImagenes = 0;

      for (const p of lista) {
        const imagenes = await obtenerImagenesProducto(p.code);
        if (!imagenes.length) continue;
        const nombreBase = p.barcode || p.code || 'producto';

        imagenes.forEach((imagen, index) => {
          const nombre = imagenes.length === 1
            ? `${nombreBase}.jpg`
            : `${nombreBase}_${index + 1}.jpg`;
          zip.file(nombre, imagen);
          totalImagenes++;
        });
      }

      if (!totalImagenes) { alert('No hay imágenes para descargar'); return; }

      const content = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = 'klohe_imagenes.zip';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    /* ---------- WIX CSV 91 COLUMNAS ---------- */
    async function descargarWixCSV() {
      const lista = JSON.parse(localStorage.getItem('inventory')) || [];
      if (!lista.length) { alert('No hay productos'); return; }

      // Cabecera Wix 91 columnas (exportada hoy)
      const header = [
        'handle','fieldType','name','visible','plainDescription','media','mediaAltText','ribbon','brand',
        'price','strikethroughPrice','baseUnit','baseUnitMeasurement','totalUnits','totalUnitsMeasurement',
        'cost','inventory','preOrderEnabled','preOrderMessage','preOrderLimit','sku','barcode','weight',
        'productOptionName1','productOptionType1','productOptionChoices1','productOptionName2','productOptionType2','productOptionChoices2',
        'productOptionName3','productOptionType3','productOptionChoices3','productOptionName4','productOptionType4','productOptionChoices4',
        'productOptionName5','productOptionType5','productOptionChoices5','productOptionName6','productOptionType6','productOptionChoices6',
        'modifierName1','modifierType1','modifierCharLimit1','modifierMandatory1','modifierDescription1',
        'modifierName2','modifierType2','modifierCharLimit2','modifierMandatory2','modifierDescription2',
        'modifierName3','modifierType3','modifierCharLimit3','modifierMandatory3','modifierDescription3',
        'modifierName4','modifierType4','modifierCharLimit4','modifierMandatory4','modifierDescription4',
        'modifierName5','modifierType5','modifierCharLimit5','modifierMandatory5','modifierDescription5',
        'modifierName6','modifierType6','modifierCharLimit6','modifierMandatory6','modifierDescription6',
        'modifierName7','modifierType7','modifierCharLimit7','modifierMandatory7','modifierDescription7',
        'modifierName8','modifierType8','modifierCharLimit8','modifierMandatory8','modifierDescription8',
        'modifierName9','modifierType9','modifierCharLimit9','modifierMandatory9','modifierDescription9',
        'modifierName10','modifierType10','modifierCharLimit10','modifierMandatory10','modifierDescription10'
      ];

      const rows = [header];

      for (const p of lista) {
        const handle = p.code || p.barcode || 'product_' + Math.random().toString(36).slice(2);
        const price  = Number(p.price || 0).toFixed(2);
        const stPrice= (p.discount && p.discount > 0) ? Number(p.price).toFixed(2) : '';
        const desc   = p.description || `<p>${p.name}</p>`;

        const fila = [];
        fila[0]  = handle;
        fila[1]  = 'PRODUCT';
        fila[2]  = p.name;
        fila[3]  = 'TRUE';
        fila[4]  = `"${desc}"`;
        fila[5]  = '';                   // media
        fila[6]  = '';
        fila[7]  = '';
        fila[8]  = '';
        fila[9]  = price;
        fila[10] = stPrice;
        // completamos 91 celdas
        while (fila.length < 91) fila.push('');
        rows.push(fila);
      }

      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wix_products.csv';
      a.click();
    }

    /* ---- init ---- */
    renderCatalogo();
    window.addEventListener('storage', e => { if (e.key === 'inventory') renderCatalogo(); });
  </script>
</body>
</html>
