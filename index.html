<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAFA">
  <meta name="robots" content="noindex,nofollow">
  <title>DAYMARSV</title>
  <link rel="icon" type="image/png" href="./isotipo.png">
  <style>
    :root {
      color-scheme: light;
      --color-bg: #FAFAFA;
      --color-panel: #FFFFFF;
      --color-accent: #AEB4BC;
      --color-accent-light: #F1F2F4;
      --color-text: #1A1A1A;
      --color-text-secondary: #6B7280;
      --color-muted: #9CA3AF;
      --color-border: #E5E7EB;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,.08);
      --radius: 16px;
      --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    .portal {
      width: min(100%, 1120px);
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: 20px;
      background: var(--color-panel);
      box-shadow: 0 18px 55px rgba(20,20,20,.08);
    }

    .topbar {
      min-height: 102px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 38px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-panel);
    }
    .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .brand-logo {
      display: block;
      width: 78px;
      height: 70px;
      flex: 0 0 78px;
      object-fit: contain;
      object-position: center;
    }
    .brand-name { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .075em; }
    .brand-tagline { display: block; margin-top: 5px; color: var(--color-muted); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
    .access-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      color: var(--color-text-secondary);
      background: #fff;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .access-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); }

    .content-grid {
      display: grid;
      grid-template-columns: 1.16fr .84fr;
      min-height: 520px;
    }
    .overview {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: 42px 42px 40px;
      overflow: hidden;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFFFFF 65%, #F9FAFB 100%);
    }
    .overview::before {
      content: "";
      position: absolute;
      top: -265px;
      right: -160px;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(156,163,175,.18);
      border-radius: 50%;
      box-shadow: 0 0 0 30px rgba(156,163,175,.04), 0 0 0 65px rgba(156,163,175,.025);
      pointer-events: none;
    }
    .overview-copy { position: relative; z-index: 1; margin-bottom: 25px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #6B7280;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 20px; height: 2px; border-radius: 2px; background: var(--color-accent); }
    .overview h1 { margin: 0; font-size: clamp(27px, 3.1vw, 36px); font-weight: 650; letter-spacing: -.04em; }
    .overview-copy p { margin: 8px 0 0; color: var(--color-text-secondary); font-size: 12px; }

    /* Panel decorativo: representa módulos y registros sin inventar cifras. */
    .admin-preview {
      position: relative;
      z-index: 1;
      width: min(100%, 600px);
      padding: 17px;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      background: var(--color-panel);
      box-shadow: var(--shadow-md);
    }
    .preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .preview-brand { display: flex; align-items: center; gap: 9px; }
    .preview-mark { position: relative; width: 26px; height: 26px; border-radius: 8px; background: var(--color-accent-light); }
    .preview-mark::before, .preview-mark::after { content: ""; position: absolute; left: 7px; height: 3px; border-radius: 3px; background: var(--color-accent); }
    .preview-mark::before { top: 8px; width: 12px; }
    .preview-mark::after { top: 14px; width: 8px; }
    .skeleton-title { display: grid; gap: 4px; }
    .skeleton-title i { display: block; width: 77px; height: 4px; border-radius: 4px; background: #D1D5DB; }
    .skeleton-title i:last-child { width: 47px; background: #E5E7EB; }
    .window-dots { display: flex; gap: 4px; }
    .window-dots i { width: 5px; height: 5px; border-radius: 50%; background: #D1D5DB; }
    .preview-grid { display: grid; grid-template-columns: 40px 1fr; gap: 11px; }
    .preview-rail { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 10px 0; border-radius: 8px; background: #F9FAFB; }
    .preview-rail i { width: 14px; height: 14px; border-radius: 4px; background: #E5E7EB; }
    .preview-rail i:first-child { background: var(--color-accent); }
    .preview-main { display: grid; gap: 9px; min-width: 0; }
    .metric-placeholders { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .metric-placeholder { height: 46px; padding: 8px; border: 1px solid #EEF0F2; border-radius: 7px; }
    .metric-placeholder::before, .metric-placeholder::after { content: ""; display: block; height: 4px; border-radius: 4px; background: #E5E7EB; }
    .metric-placeholder::before { width: 48%; margin-bottom: 7px; }
    .metric-placeholder::after { width: 75%; height: 8px; background: var(--color-accent-light); }
    .preview-bottom { display: grid; grid-template-columns: 1.35fr .65fr; gap: 8px; }
    .chart-panel, .rows-panel { min-width: 0; height: 106px; padding: 9px; border: 1px solid #EEF0F2; border-radius: 7px; background: #fff; }
    .tiny-line { display: block; width: 45px; height: 4px; margin-bottom: 10px; border-radius: 4px; background: #D1D5DB; }
    .chart {
      display: flex;
      align-items: end;
      justify-content: space-around;
      gap: 7px;
      height: 69px;
      padding: 0 7px;
      border-bottom: 1px solid #E5E7EB;
      background: repeating-linear-gradient(to bottom, transparent 0 16px, #F3F4F6 17px 18px);
    }
    .chart i { width: 10%; border-radius: 3px 3px 0 0; background: #D1D5DB; }
    .chart i:nth-child(1) { height: 39%; }
    .chart i:nth-child(2) { height: 62%; }
    .chart i:nth-child(3) { height: 48%; background: var(--color-accent); }
    .chart i:nth-child(4) { height: 81%; }
    .chart i:nth-child(5) { height: 58%; background: var(--color-accent); }
    .chart i:nth-child(6) { height: 93%; }
    .rows-panel { display: grid; align-content: start; gap: 9px; }
    .row-placeholder { display: flex; align-items: center; gap: 6px; }
    .row-placeholder i { width: 12px; height: 12px; border-radius: 4px; background: #F3F4F6; }
    .row-placeholder b { flex: 1; height: 4px; border-radius: 4px; background: #E5E7EB; }
    .row-placeholder em { width: 13px; height: 4px; border-radius: 4px; background: var(--color-accent-light); }

    .access-panel {
      display: grid;
      place-items: center;
      padding: 42px 38px;
      border-left: 1px solid var(--color-border);
      background: #FCFCFC;
    }
    .login-card { width: min(100%, 330px); }
    .login-card .eyebrow { margin-bottom: 13px; }
    .login-card h2 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -.035em; }
    .login-subtitle { margin: 8px 0 28px; color: var(--color-text-secondary); font-size: 12px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 8px; color: #374151; font-size: 12px; font-weight: 600; }
    .input-wrap { position: relative; }
    .input-wrap svg { position: absolute; top: 50%; left: 13px; width: 17px; height: 17px; color: var(--color-muted); transform: translateY(-50%); pointer-events: none; }
    input {
      width: 100%;
      height: 48px;
      padding: 0 13px 0 41px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: var(--color-text);
      font: inherit;
      font-size: 13px;
      transition: border-color .18s, box-shadow .18s;
    }
    input::placeholder { color: var(--color-muted); }
    input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(156,163,175,.18); }
    .submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      background: var(--color-text);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    .submit-button:hover { background: #34383D; transform: translateY(-1px); }
    .submit-button:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 3px; }
    .submit-button svg { width: 16px; height: 16px; }

    #loadingOverlay { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(250,250,250,.9); }
    .spinner { width: 38px; height: 38px; border: 3px solid var(--color-accent-light); border-top-color: var(--color-accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 780px) {
      body { padding: 18px; }
      .portal { width: min(100%, 540px); border-radius: 16px; }
      .topbar { min-height: 86px; padding: 13px 21px; }
      .brand-logo { width: 65px; height: 59px; flex-basis: 65px; }
      .brand-name { font-size: 14px; }
      .brand-tagline { font-size: 8px; }
      .access-status { padding: 8px 10px; font-size: 8px; }
      .content-grid { grid-template-columns: 1fr; }
      .overview { padding: 27px 23px 25px; }
      .overview-copy { margin-bottom: 16px; }
      .overview h1 { font-size: 27px; }
      .overview-copy p { font-size: 11px; }
      .admin-preview { max-width: 490px; margin: 0 auto; padding: 12px; }
      .preview-grid { grid-template-columns: 34px 1fr; gap: 8px; }
      .preview-rail { gap: 7px; }
      .preview-rail i { width: 12px; height: 12px; }
      .metric-placeholder { height: 40px; padding: 6px; }
      .preview-bottom { grid-template-columns: 1.3fr .7fr; gap: 6px; }
      .chart-panel, .rows-panel { height: 93px; padding: 7px; }
      .chart { height: 58px; }
      .access-panel { padding: 30px 24px 35px; border-top: 1px solid var(--color-border); border-left: 0; }
      .login-card { width: min(100%, 390px); }
      .login-card h2 { font-size: 25px; }
      .login-subtitle { margin-bottom: 21px; }
    }
    @media (max-width: 390px) {
      body { padding: 10px; }
      .topbar { padding: 11px 14px; }
      .brand { gap: 10px; }
      .brand-logo { width: 58px; height: 54px; flex-basis: 58px; }
      .brand-name { font-size: 12px; letter-spacing: .04em; }
      .access-status { gap: 6px; padding: 7px 8px; font-size: 7px; letter-spacing: .02em; }
      .overview { padding: 23px 16px 20px; }
      .preview-bottom { grid-template-columns: 1fr; }
      .rows-panel { display: none; }
      .chart-panel { height: 87px; }
      .chart { height: 53px; }
      .access-panel { padding: 26px 18px 30px; }
    }
  </style>
</head>
<body>
  <main class="portal">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="./isotipo.png" alt="Isotipo DAYMARSHOP" width="78" height="70">
        <div>
          <p class="brand-name">DAYMARSHOP</p>
          <span class="brand-tagline">A Family Company</span>
        </div>
      </div>
      <div class="access-status">Sistema interno</div>
    </header>

    <div class="content-grid">
      <section class="overview" aria-label="Panel de administración">
        <div class="overview-copy">
          <p class="eyebrow">Panel de administración</p>
          <h1>Gestión empresarial</h1>
          <p>Información organizada para tu empresa.</p>
        </div>
        <div class="admin-preview" aria-hidden="true">
          <div class="preview-head">
            <div class="preview-brand">
              <span class="preview-mark"></span>
              <span class="skeleton-title"><i></i><i></i></span>
            </div>
            <span class="window-dots"><i></i><i></i><i></i></span>
          </div>
          <div class="preview-grid">
            <div class="preview-rail"><i></i><i></i><i></i><i></i></div>
            <div class="preview-main">
              <div class="metric-placeholders"><div class="metric-placeholder"></div><div class="metric-placeholder"></div><div class="metric-placeholder"></div></div>
              <div class="preview-bottom">
                <div class="chart-panel"><span class="tiny-line"></span><div class="chart"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
                <div class="rows-panel"><span class="tiny-line"></span><span class="row-placeholder"><i></i><b></b><em></em></span><span class="row-placeholder"><i></i><b></b><em></em></span><span class="row-placeholder"><i></i><b></b><em></em></span></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="access-panel" aria-labelledby="loginTitle">
        <div class="login-card">
          <p class="eyebrow">Acceso</p>
          <h2 id="loginTitle">Iniciar sesión</h2>
          <p class="login-subtitle">Ingresa tus credenciales para continuar.</p>
          <form id="loginForm" autocomplete="on">
            <div class="field">
              <label for="userID">Usuario</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M5 20c.6-3.3 3.1-5 7-5s6.4 1.7 7 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <input type="text" id="userID" name="username" placeholder="Ingresa tu usuario" autocomplete="username" required autofocus>
              </div>
            </div>
            <div class="field">
              <label for="userClave">Contraseña</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <input type="password" id="userClave" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
              </div>
            </div>
            <button class="submit-button" type="submit">Ingresar <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <div id="loadingOverlay" role="status" aria-label="Ingresando"><div class="spinner" aria-hidden="true"></div></div>

  <script>
    /* ---------- IndexedDB ---------- */
    const DB_NAME = 'sessionDB', STORE_NAME = 'sessions';
    let db;

    async function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(db = request.result);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    }

    async function guardarSesion(user) {
      const transaction = db.transaction([STORE_NAME], 'readwrite');
      transaction.objectStore(STORE_NAME).put(user);
    }

    /* ---------- Usuarios ---------- */
    const users = [
      { id: '2005', clave: 'admin2024', nombre: 'ERNESTO TOBIAS', foto: 'user2005.jpg' },
      { id: '1001', clave: 'viewer2024', nombre: 'PAOLA PALACIOS', foto: 'userpaola.jpg' }
    ];

    /* ---------- Login ---------- */
    async function login() {
      const userID = document.getElementById('userID').value.trim();
      const userClave = document.getElementById('userClave').value.trim();
      const user = users.find(item => item.id === userID && item.clave === userClave);

      if (!user) {
        alert('ID o contraseña incorrectos.');
        return;
      }

      try {
        if (!db) await openDB();
        await guardarSesion(user);
      } catch (error) {
        console.error('No se pudo guardar la sesión:', error);
        alert('No se pudo iniciar el sistema. Intenta de nuevo.');
        return;
      }

      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('userID', user.id);
      sessionStorage.setItem('nombre', user.nombre);
      sessionStorage.setItem('foto', user.foto);

      document.getElementById('loadingOverlay').style.display = 'grid';
      location.href = 'menu.html';
    }

    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      login();
    });

    window.addEventListener('DOMContentLoaded', () => {
      openDB().catch(error => console.error('No se pudo abrir la base de datos de sesión:', error));
    });
  </script>
</body>
</html>
